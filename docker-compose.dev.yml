version: '3.8'

# Development Compose file: Starts Postgres and Redis dependencies with instant port forwarding
services:
  postgres:
    image: postgres:16-alpine
    container_name: crewsync_dev_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: crewsync
    ports:
      - "5432:5432"
    volumes:
      - dev_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: crewsync_dev_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - dev_redis_data:/data

volumes:
  dev_pg_data:
  dev_redis_data:
