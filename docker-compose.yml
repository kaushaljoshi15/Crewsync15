version: '3.8'

services:
  # 1. PostgreSQL 16 Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: crewsync_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: crewsync
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crewsync"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crewsync_net

  # 2. Redis 7 In-Memory Cache & Rate Limiter
  redis:
    image: redis:7-alpine
    container_name: crewsync_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crewsync_net

  # 3. High-Performance Go Backend Microservice
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crewsync_backend
    restart: unless-stopped
    environment:
      PORT: 8080
      APP_ENV: production
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/crewsync?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super-secure-jwt-production-secret-faang-ready
      JWT_EXPIRES_IN_HOURS: 72
      CLIENT_URL: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crewsync_net

  # 4. Next.js 15 Modern Frontend Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: crewsync_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - crewsync_net

volumes:
  pg_data:
    name: crewsync_pg_data
  redis_data:
    name: crewsync_redis_data

networks:
  crewsync_net:
    name: crewsync_network
    driver: bridge
