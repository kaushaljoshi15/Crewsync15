name: CrewSync Distributed CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Go Backend Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Install Dependencies
        working-directory: ./backend
        run: go mod download

      - name: Run Unit Tests with Race Detection
        working-directory: ./backend
        run: go test -v -race ./...

      - name: Build Go Binary
        working-directory: ./backend
        run: CGO_ENABLED=0 GOOS=linux go build -v -o server ./cmd/server/main.go

  docker-build:
    name: Docker Multi-Stage Container Build
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Go Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: crewsync-backend:latest
